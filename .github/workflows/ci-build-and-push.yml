name: Build and publish Docker image

# Run on pushes to main and on new tags
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write           # allow publishing packages (GHCR)
      id-token: write           # not required here but harmless
      contents: read 
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.tag_name }} # Explicitly checkout the new tag

      - name: Extract Tag Name
        id: get_version
        run: |
          VERSION=${{ inputs.tag_name }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # - name: Set up QEMU (for multi-arch, optional)
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GHCR using the automatically provided GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (lowercase-safe)
        id: meta
        run: |
          REPO=${{github.repository,,}}
          SHA="${{ github.sha }}"

          IMAGE="ghcr.io/${REPO}"

          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "tag=${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          provenance: false # Disable provenance to avoid unknown/unknown
          sbom: false       # Disable sbom to avoid unknown/unknown
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true

          # Image name format: ghcr.io/<owner>/<repo>:<tag>
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    name: Update Helm values.yaml
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: JCodeX-Dev/RohanWedsBlessy
          ref: 'main'
          token: ${{ secrets.rb_repo }}

      - name: Update image tag in values.yaml
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
          NEW_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          VALUES_FILE="./applications/values/values-rb-${{ github.event.repository.name,, }}.yaml"
          pwd
          ls
          echo "Updating image:"
          echo "  repository: ${NEW_IMAGE}"
          echo "  tag: ${NEW_TAG}"
          echo " pwd: ${PWD}"

          # install yq
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          yq -i '
            .image.name = strenv(NEW_IMAGE) |
            .image.tag = strenv(NEW_TAG)
          ' "${VALUES_FILE}"

      - name: Commit and push Helm change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "chore: Update ${{ github.event.repository.name }} image tag to ${{ needs.build-and-push.outputs.tag }}"
          git push